name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Select firmware release
        id: firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            release_tag="${PUBLISHED_RELEASE_TAG}"
          else
            release_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          fi

          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: ${release_tag}" >&2
            exit 1
          fi

          firmware_file="solar-unlocked-${release_tag}-es3c35p-factory.bin"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${release_tag#v}" >> "${GITHUB_OUTPUT}"
          echo "file=${firmware_file}" >> "${GITHUB_OUTPUT}"

      - name: Prepare website and download firmware release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMWARE_TAG: ${{ steps.firmware.outputs.tag }}
          FIRMWARE_VERSION: ${{ steps.firmware.outputs.version }}
          FIRMWARE_FILE: ${{ steps.firmware.outputs.file }}
        run: |
          ota_file="solar-unlocked-${FIRMWARE_TAG}-es3c35p-ota.bin"

          mkdir -p _site
          cp -a site/. _site/
          rm -rf _site/firmware
          mkdir -p _site/firmware

          gh release download "${FIRMWARE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${FIRMWARE_FILE}" \
            --pattern "${ota_file}" \
            --dir _site/firmware

          test -s "_site/firmware/${FIRMWARE_FILE}"
          test -s "_site/firmware/${ota_file}"

          ota_size="$(stat -c '%s' "_site/firmware/${ota_file}")"
          ota_sha256="$(sha256sum "_site/firmware/${ota_file}" | cut -d ' ' -f 1)"
          ota_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${FIRMWARE_TAG}/${ota_file}"

          jq \
            --arg version "${FIRMWARE_VERSION}" \
            --arg path "firmware/${FIRMWARE_FILE}" \
            '.version = $version | .builds[0].parts[0].path = $path' \
            site/manifest.json > _site/manifest.json

          jq -n \
            --arg version "${FIRMWARE_VERSION}" \
            --arg hardware "es3c35p" \
            --arg url "${ota_url}" \
            --argjson size "${ota_size}" \
            --arg sha256 "${ota_sha256}" \
            --arg releaseNotes "Solar Unlocked ${FIRMWARE_VERSION}" \
            '{
              version: $version,
              hardware: $hardware,
              url: $url,
              size: $size,
              sha256: $sha256,
              releaseNotes: $releaseNotes
            }' > _site/firmware/latest.json

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
